
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskManager: aplicación web para organizar y administrar tareas.">
    <title>TaskManager | Gestión de tareas</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>TaskManager</h1>
            <p>Organiza tus tareas y alcanza tus objetivos.</p>
        </div>
    </header>

    <main class="container">
        <section class="dashboard">
            <h2>Resumen de tareas</h2>

            <div class="summary-grid">
                <article class="summary-card">
                    <h3>Total de tareas</h3>
                    <p id="totalTasks">0</p>
                </article>

                <article class="summary-card">
                    <h3>Pendientes</h3>
                    <p id="pendingTasks">0</p>
                </article>

                <article class="summary-card">
                    <h3>Completadas</h3>
                    <p id="completedTasks">0</p>
                </article>
            </div>
        </section>

        <section class="panel">
            <h2>Nueva tarea</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Título de la tarea</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Escribe el título de tu tarea"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descripción</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Describe la tarea"
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="taskPriority">Prioridad</label>
                    <select id="taskPriority">
                        <option value="Alta">Alta</option>
                        <option value="Media" selected>Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Agregar tarea
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Mis tareas</h2>

            <div class="filters">
                <div class="form-group">
                    <label for="searchInput">Buscar por título</label>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Buscar tareas..."
                    >
                </div>

                <div class="form-group">
                    <label for="statusFilter">Filtrar por estado</label>
                    <select id="statusFilter">
                        <option value="all">Todas</option>
                        <option value="pending">Pendientes</option>
                        <option value="completed">Completadas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sortBy">Ordenar por</label>
                    <select id="sortBy">
                        <option value="date">Fecha de creación</option>
                        <option value="priority">Prioridad</option>
                    </select>
                </div>
            </div>

            <div id="notification" role="status" aria-live="polite"></div>

            <div id="taskList">
                <p id="emptyMessage">
                    Todavía no hay tareas. ¡Agrega la primera!
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>TaskManager | Actividad Integradora 2</p>
        <p>Aplicación desarrollada con HTML, CSS y JavaScript.</p>
    </footer>
</body>
</html>
